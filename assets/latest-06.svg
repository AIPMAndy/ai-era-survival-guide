<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1098" width="1080" height="1098" role="img" aria-label="主业怎么长出第二收入"><rect width="1080" height="1098" fill="#f9f8f5"/><rect width="1080" height="11" fill="#15212e"/><text x="65" y="67" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" letter-spacing="5" fill="#b09060">AI / CAREER / CHINA</text><text x="1015" y="67" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="2" fill="#7f858b">06</text><text x="65" y="150" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="58" font-weight="600" fill="#121924">主业怎么长出第二收入</text><text x="65" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" fill="#697480">沿着已有经验提供可以付费的服务</text><line x1="65" y1="250" x2="1015" y2="250" stroke="#d9d6d1"/><text x="78" y="320" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">内容运营</text><text x="250" y="290" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">内容策划和账号服务</text><text x="250" y="345" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">交付选题、脚本、排期及复盘</text><line x1="65" y1="395" x2="1015" y2="395" stroke="#d9d6d1"/><text x="78" y="465" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">产品与研发</text><text x="250" y="435" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">小型工具或 AI 应用</text><text x="250" y="490" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">解决特定流程，按项目交付</text><line x1="65" y1="540" x2="1015" y2="540" stroke="#d9d6d1"/><text x="78" y="610" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">HR与职业服务</text><text x="250" y="580" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">求职辅导和专业咨询</text><text x="250" y="635" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">依托真实工作经验形成服务</text><line x1="65" y1="685" x2="1015" y2="685" stroke="#d9d6d1"/><text x="78" y="755" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">财务与数据</text><text x="250" y="725" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">报表、整理和经营分析</text><text x="250" y="780" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">在合法执业范围内提供支持</text><line x1="65" y1="830" x2="1015" y2="830" stroke="#d9d6d1"/><text x="78" y="900" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">外贸与销售</text><text x="250" y="870" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">产品资料和获客服务</text><text x="250" y="925" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">服务熟悉的细分行业和客户</text><rect x="65" y="983" width="950" height="2" fill="#b99663"/><text x="65" y="1043" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="27" fill="#977143">先出现真实付费需求，再决定是否加大投入</text></svg>