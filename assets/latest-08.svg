<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 953" width="1080" height="953" role="img" aria-label="管理者怎么用 AI"><rect width="1080" height="953" fill="#f9f8f5"/><rect width="1080" height="11" fill="#15212e"/><text x="65" y="67" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" letter-spacing="5" fill="#b09060">AI / CAREER / CHINA</text><text x="1015" y="67" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="2" fill="#7f858b">08</text><text x="65" y="150" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="58" font-weight="600" fill="#121924">管理者怎么用 AI</text><text x="65" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" fill="#697480">部署工具以后，还要让团队真的受益</text><line x1="65" y1="250" x2="1015" y2="250" stroke="#d9d6d1"/><text x="78" y="320" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">01</text><text x="250" y="290" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">选对场景</text><text x="250" y="345" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">从高频、稳定、能核对的流程开始</text><line x1="65" y1="395" x2="1015" y2="395" stroke="#d9d6d1"/><text x="78" y="465" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">02</text><text x="250" y="435" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">接好系统</text><text x="250" y="490" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">知识库、业务工具和权限打通</text><line x1="65" y1="540" x2="1015" y2="540" stroke="#d9d6d1"/><text x="78" y="610" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">03</text><text x="250" y="580" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">明确责任</text><text x="250" y="635" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">核对、例外处理和审批各有人负责</text><line x1="65" y1="685" x2="1015" y2="685" stroke="#d9d6d1"/><text x="78" y="755" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">04</text><text x="250" y="725" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">持续算账</text><text x="250" y="780" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">计算成本、故障、质量和业务收入</text><rect x="65" y="838" width="950" height="2" fill="#b99663"/><text x="65" y="898" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="27" fill="#977143">部署只是起点，交付和复购才说明它有价值</text></svg>