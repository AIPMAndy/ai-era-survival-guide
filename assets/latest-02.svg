<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1098" width="1080" height="1098" role="img" aria-label="企业为什么重新分配工作"><rect width="1080" height="1098" fill="#f9f8f5"/><rect width="1080" height="11" fill="#15212e"/><text x="65" y="67" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" letter-spacing="5" fill="#b09060">AI / CAREER / CHINA</text><text x="1015" y="67" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="2" fill="#7f858b">02</text><text x="65" y="150" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="58" font-weight="600" fill="#121924">企业为什么重新分配工作</text><text x="65" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" fill="#697480">先看一项任务的经济账，再看岗位怎么变</text><line x1="65" y1="250" x2="1015" y2="250" stroke="#d9d6d1"/><text x="78" y="320" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">01</text><text x="250" y="290" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">重复劳动</text><text x="250" y="345" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">文案、资料整理和信息归类会先变便宜</text><line x1="65" y1="395" x2="1015" y2="395" stroke="#d9d6d1"/><text x="78" y="465" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">02</text><text x="250" y="435" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">错误成本</text><text x="250" y="490" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">财务、医疗、理赔和生产仍要有人负责</text><line x1="65" y1="540" x2="1015" y2="540" stroke="#d9d6d1"/><text x="78" y="610" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">03</text><text x="250" y="580" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">系统接入</text><text x="250" y="635" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">模型能回答，还需要接入 ERP、CRM 和权限</text><line x1="65" y1="685" x2="1015" y2="685" stroke="#d9d6d1"/><text x="78" y="755" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">04</text><text x="250" y="725" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">业务增长</text><text x="250" y="780" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">新订单、新客户和服务需求也会带来岗位</text><line x1="65" y1="830" x2="1015" y2="830" stroke="#d9d6d1"/><text x="78" y="900" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">05</text><text x="250" y="870" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">人员配置</text><text x="250" y="925" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">企业会重新计算培训成本和招聘需求</text><rect x="65" y="983" width="950" height="2" fill="#b99663"/><text x="65" y="1043" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="27" fill="#977143">企业愿不愿意长期用，取决于真实成本和结果</text></svg>