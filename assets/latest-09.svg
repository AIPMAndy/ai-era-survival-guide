<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 953" width="1080" height="953" role="img" aria-label="从现在到 2029 年"><rect width="1080" height="953" fill="#f9f8f5"/><rect width="1080" height="11" fill="#15212e"/><text x="65" y="67" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" letter-spacing="5" fill="#b09060">AI / CAREER / CHINA</text><text x="1015" y="67" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="2" fill="#7f858b">09</text><text x="65" y="150" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="58" font-weight="600" fill="#121924">从现在到 2029 年</text><text x="65" y="206" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="27" fill="#697480">围绕主业升级和第二收入持续推进</text><line x1="65" y1="250" x2="1015" y2="250" stroke="#d9d6d1"/><text x="78" y="320" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="48" fill="#a9844f">现在</text><text x="250" y="290" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">建立自己的 AI 工作方式</text><text x="250" y="345" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">选一项常做任务，形成稳定工具链</text><line x1="65" y1="395" x2="1015" y2="395" stroke="#d9d6d1"/><text x="78" y="465" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">2027</text><text x="250" y="435" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">把效率转成实际贡献</text><text x="250" y="490" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">独立负责更完整的流程或项目</text><line x1="65" y1="540" x2="1015" y2="540" stroke="#d9d6d1"/><text x="78" y="610" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">2028</text><text x="250" y="580" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">积累外部可见的成果</text><text x="250" y="635" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">沉淀案例、行业经验和第二收入</text><line x1="65" y1="685" x2="1015" y2="685" stroke="#d9d6d1"/><text x="78" y="755" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="32" fill="#a9844f">2029</text><text x="250" y="725" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-weight="600" font-size="38" fill="#171c22">提高职业选择权</text><text x="250" y="780" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#626c78">争取更有价值的岗位、合作与客户</text><rect x="65" y="838" width="950" height="2" fill="#b99663"/><text x="65" y="898" font-family="'Songti SC','Noto Serif CJK SC','STSong','SimSun',serif" font-size="27" fill="#977143">主业保底，AI 提高效率，第二收入增加空间</text></svg>