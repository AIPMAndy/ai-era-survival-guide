name: Content and site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check repository content, local links and images
        run: python3 scripts/check_content.py
      - name: Parse browser JavaScript
        run: |
          node --version
          python3 scripts/extract_script.py
          node --check /tmp/ai-era-check-script.js
      - name: Run offline feedback grading tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/grade_feedback.py labs/sample-predictions-not-a-model-result.csv
      - name: Validate China 2027-2029 series and three exercise scorers
        run: |
          python3 series/scripts/test_scorers.py
          python3 - <<'PYTEST'
          from pathlib import Path
          import re
          root=Path('series')
          for slug in ['01-policy','02-forecast','03-roles','04-career-paths','05-practice','06-cases','07-labs']:
              p=root/(slug+'.md')
              assert p.exists() and len(p.read_text(encoding='utf8'))>1000,p
              for u in re.findall(r'!\\[[^\\]]*\\]\\(([^)]+)\\)',p.read_text(encoding='utf8')):
                  if not u.startswith(('https:','http:')):
                      assert (root/u).exists(),(p,u)
          for file in ['24条评论_练习数据.csv','24条评论_参考答案.csv','模拟财务对账30行.csv','模拟财务对账_标准答案.csv','虚构JD10条_证据练习.csv','虚构JD_技能标签标准答案.csv']:
              assert (root/'可直接填写的表格'/file).is_file(),file
          assert (root/'index.html').is_file()
          print('PASS: six volumes, three labs, assets and navigation')
          PYTEST
      - name: Check laboratory JavaScript syntax
        run: |
          python3 - <<'PYTEST'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__();self.inside=False;self.chunks=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.inside=True
              def handle_endtag(self,tag):
                  if tag == 'script': self.inside=False
              def handle_data(self,data):
                  if self.inside:self.chunks.append(data)
          for name in ['index.html','lab.html']:
              parser=Parser();parser.feed(Path(name).read_text(encoding='utf8'))
              Path('/tmp/'+name+'.js').write_text(''.join(parser.chunks),encoding='utf8')
          PYTEST
          node --check /tmp/index.html.js
          node --check /tmp/lab.html.js
